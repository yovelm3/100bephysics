<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" direction="ltr" role="img" aria-label="קרונית במסה 80 קילוגרם נעה ימינה במהירות 3 מטר לשנייה על מסילה חלקה. אדם במסה 60 קילוגרם רץ אחריה במהירות 8 מטר לשנייה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="140" width="500" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="140" x2="530" y2="140" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<polygon points="260,80 400,80 390,126 270,126" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="290" cy="130" r="10" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="370" cy="130" r="10" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="410" y1="100" x2="470" y2="100" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="476" y="104" text-anchor="start">V₁ = 3 m/s</text>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="150" cy="78.4" r="11.2"/><line x1="150" y1="89.6" x2="150" y2="117.6"/><line x1="150" y1="117.6" x2="137.4" y2="140"/><line x1="150" y1="117.6" x2="162.6" y2="140"/><line x1="133.2" y1="100.8" x2="166.8" y2="100.8"/></g>
<line x1="175" y1="90" x2="225" y2="90" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="200" y="80" text-anchor="middle">v = 8 m/s</text>
</svg>
