<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="מבט מלמעלה: קיר מקביל לציר y. מהנקודה O נעים שני חלקיקים: חלקיק 1 פוגע בקיר בניצב לו, וחלקיק 2 פוגע בקיר בזווית אלפא וחוזר בזווית בטא">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="40" y1="200" x2="420" y2="200" stroke="var(--d-line)" stroke-width="1.6" marker-end="url(#f-axis)"/>
<line x1="40" y1="200" x2="40" y2="20" stroke="var(--d-line)" stroke-width="1.6" marker-end="url(#f-axis)"/>
<text class="label" x="426" y="204" text-anchor="start">x</text>
<text class="label" x="46" y="26" text-anchor="start">y</text>
<rect x="380" y="30" width="10" height="160" rx="0" fill="var(--d-label)" stroke="none" stroke-width="0"/>
<circle cx="100" cy="130" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="90" y="134" text-anchor="end">O</text>
<line x1="100" y1="130" x2="376" y2="130" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="240" y="146" text-anchor="middle">1</text>
<line x1="100" y1="130" x2="376" y2="70" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="230" y="92" text-anchor="middle">2</text>
<line x1="376" y1="70" x2="220" y2="36" stroke="var(--d-line)" stroke-width="1.6" stroke-linecap="round"/>
<text class="label" x="360" y="86" text-anchor="end">α</text>
<text class="label" x="360" y="60" text-anchor="end">β</text>
</svg>
