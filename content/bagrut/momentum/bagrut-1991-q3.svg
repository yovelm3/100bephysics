<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" direction="ltr" role="img" aria-label="מבט מלמעלה: קרונית K נעה על מסילה חלקה EF במהירות 0.2 מטר לשנייה. קיר חלק CD מקביל למסילה, במרחק 1 מטר. כשהקרונית חולפת מול הנקודה M על הקיר, נזרק ממנה כדור לכיוון הקיר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="120" y1="20" x2="120" y2="240" stroke="var(--d-line)" stroke-width="3" stroke-linecap="round"/>
<text class="label" x="110" y="24" text-anchor="end">F</text>
<text class="label" x="110" y="244" text-anchor="end">E</text>
<rect x="400" y="20" width="14" height="220" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="400" y1="20" x2="400" y2="240" stroke="var(--d-line)" stroke-width="3" stroke-linecap="round"/>
<text class="label" x="424" y="24" text-anchor="start">D</text>
<text class="label" x="424" y="244" text-anchor="start">C</text>
<rect x="108" y="130" width="24" height="40" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="100" y="154" text-anchor="end">K</text>
<line x1="120" y1="125" x2="120" y2="85" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="130" y="104" text-anchor="start">0.2 m/s</text>
<circle cx="400" cy="150" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="386" y="154" text-anchor="end">M</text>
<line x1="120" y1="210" x2="400" y2="210" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="260" y="228" text-anchor="middle">1 m</text>
</svg>
