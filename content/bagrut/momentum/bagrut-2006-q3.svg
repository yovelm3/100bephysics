<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="קרונית במסה 0.6 קילוגרם נעה ימינה במהירות 2 מטר לשנייה על מסילה אופקית חסרת חיכוך. מתחת לקרונית מודבק כדור במסה 0.2 קילוגרם. ציר x לאורך המסילה וציר y כלפי מטה, וראשית הצירים במקום הכדור ברגע t=0">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="140" y="40" width="180" height="40" rx="0" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="165" cy="86" r="7" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="295" cy="86" r="7" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<line x1="60" y1="93" x2="500" y2="93" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="300" y1="26" x2="360" y2="26" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="368" y="30" text-anchor="start">v = 2 m/s</text>
<circle cx="230" cy="98" r="6" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<line x1="230" y1="98" x2="460" y2="98" stroke="var(--d-dim)" stroke-width="1.2" marker-end="url(#f-axis)"/>
<text class="label" x="466" y="102" text-anchor="start">x</text>
<line x1="230" y1="98" x2="230" y2="190" stroke="var(--d-dim)" stroke-width="1.2" marker-end="url(#f-axis)"/>
<text class="label" x="240" y="190" text-anchor="start">y</text>
</svg>
