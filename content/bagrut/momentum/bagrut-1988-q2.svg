<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="גוש פלסטלינה נזרק אופקית במהירות 8 מטר לשנייה מגג בניין בגובה 5 מטר, ופוגע בקרונית שעומדת על הקרקע">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="230" width="480" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="230" x2="520" y2="230" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="60" y="50" width="50" height="180" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="40" y1="50" x2="40" y2="230" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="26" y="144" text-anchor="middle" transform="rotate(90.0 26 144)">5 m</text>
<circle cx="112" cy="44" r="7" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<line x1="122" y1="44" x2="170" y2="44" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="176" y="48" text-anchor="start">v₀ = 8 m/s</text>
<path d="M 112,44 Q 260,44 340,200" fill="none" stroke="var(--d-dim)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/>
<polygon points="310,200 380,200 372,222 318,222" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="326" cy="226" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="364" cy="226" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
</svg>
