<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" direction="ltr" role="img" aria-label="מטוטלת בליסטית בשלושה שלבים: קליע m1 במהירות v0 נע לעבר גוף m2 שתלוי על חוט באורך ℓ; הקליע נעצר בגוף בנקודה A; הגוף עם הקליע עולה עד הנקודה B, שבה החוט נוטה בזווית תטא מהאנך">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="425" y="28" width="50" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="425" y1="40" x2="475" y2="40" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<text class="heb" x="450" y="24" text-anchor="middle" direction="rtl">שלב ראשון</text>
<rect x="255" y="28" width="50" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="255" y1="40" x2="305" y2="40" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<text class="heb" x="280" y="24" text-anchor="middle" direction="rtl">שלב שני</text>
<rect x="75" y="28" width="50" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="75" y1="40" x2="125" y2="40" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<text class="heb" x="100" y="24" text-anchor="middle" direction="rtl">שלב שלישי</text>
<line x1="450" y1="40" x2="450" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="458" y="100" text-anchor="start">ℓ</text>
<rect x="433" y="151" width="34" height="26" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="450" y="169" text-anchor="middle" style="fill:#ffffff">m₂</text>
<circle cx="520" cy="164" r="3" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="514" y1="156" x2="496" y2="156" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="520" y="148" text-anchor="start">v₀</text>
<text class="label" x="520" y="186" text-anchor="middle">m₁</text>
<line x1="280" y1="40" x2="280" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="263" y="151" width="34" height="26" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="280" y="169" text-anchor="middle" style="fill:#ffffff">A</text>
<text class="label" x="280" y="196" text-anchor="middle">m₁+m₂</text>
<line x1="100" y1="40" x2="45" y2="135.3" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="30" y="134.3" width="30" height="22" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5" transform="rotate(-30 45 145.3)"/>
<text class="label" x="45" y="150.3" text-anchor="middle" style="fill:#ffffff">B</text>
<line x1="100" y1="40" x2="100" y2="160" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<path d="M 85,66 A 30 30 0 0 0 100,70" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="88.6" y="87.5" text-anchor="middle">θ</text>
</svg>
