<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="מסילה חלקה AB על שולחן: A בגובה 45 סנטימטר מעל השולחן, B אופקית בקצה השולחן. השולחן בגובה 80 סנטימטר מעל הרצפה. C מתחת ל-B, והכדור פוגע ברצפה בנקודה D">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="230" width="490" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="230" x2="520" y2="230" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="60" y="120" width="220" height="10" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="80" y1="130" x2="80" y2="230" stroke="var(--d-line)" stroke-width="3" stroke-linecap="round"/>
<line x1="260" y1="130" x2="260" y2="230" stroke="var(--d-line)" stroke-width="3" stroke-linecap="round"/>
<path d="M 140,40 Q 160,118 270,118" fill="none" stroke="var(--d-line)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="140" cy="40" r="6" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="130" y="36" text-anchor="end">A</text>
<text class="label" x="272" y="108" text-anchor="start">B</text>
<line x1="110" y1="40" x2="110" y2="118" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="96" y="83" text-anchor="middle" transform="rotate(90.0 96 83)">h</text>
<line x1="40" y1="120" x2="40" y2="230" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="26" y="179" text-anchor="middle" transform="rotate(90.0 26 179)">H</text>
<text class="label" x="270" y="250" text-anchor="middle">C</text>
<text class="label" x="400" y="250" text-anchor="middle">D</text>
<path d="M 272,118 Q 340,124 400,228" fill="none" stroke="var(--d-dim)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 4"/>
</svg>
