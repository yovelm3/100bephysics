<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="מסילה: רבע מעגל PQ ברדיוס 20 סנטימטר, וקטע ישר QS. כדור A משוחרר בנקודה P, וכדור B במנוחה בנקודה S">
