<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" direction="ltr" role="img" aria-label="מדרון חלק בזווית 30 מעלות. קרונית במסה 2 קילוגרם קשורה בחוט שעובר על גלגלת בראש המדרון למשקולת m שתלויה. מעל המדרון בנקודה A מוחזק גוש פלסטלינה m'">
<defs>
