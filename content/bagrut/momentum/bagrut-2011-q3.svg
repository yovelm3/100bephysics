<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="תרשים א: מסילה חלקה ובקצה השמאלי קיר. על המסילה גופים A ו-B מחוברים בקפיץ דרוך, וגוף C מימינם. תרשים ב: הכוח שהקיר מפעיל על A כפונקציה של הזמן, משולש שמגיע לשיא ב-0.04 שניות וחוזר לאפס ב-0.08">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="20" width="12" height="110" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="52" y1="20" x2="52" y2="130" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<text class="heb" x="70" y="34" text-anchor="end" direction="rtl">קיר</text>
<line x1="52" y1="120" x2="520" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="110" y="89" width="40" height="30" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="130" y="109" text-anchor="middle" style="fill:#ffffff">A</text>
<polyline points="150,104 160,104 162.5,109 165,99 167.5,109 170,99 172.5,109 175,99 177.5,109 180,104 190,104" fill="none" stroke="var(--d-line)" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="190" y="89" width="40" height="30" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="210" y="109" text-anchor="middle" style="fill:#ffffff">B</text>
<rect x="370" y="85" width="60" height="34" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="400" y="107" text-anchor="middle" style="fill:#ffffff">C</text>
<line x1="170" y1="240" x2="408" y2="240" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<line x1="170" y1="240" x2="170" y2="132" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<line x1="258" y1="236" x2="258" y2="244" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="258" y="258" text-anchor="middle">0.04</text>
<line x1="346" y1="236" x2="346" y2="244" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="346" y="258" text-anchor="middle">0.08</text>
<text class="label" x="406" y="230" text-anchor="end">t (s)</text>
<text class="label" x="180" y="144" text-anchor="start">F (N)</text>
<polyline points="170,240 258,165 346,240" fill="none" stroke="var(--d-body)" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="258" y1="165" x2="258" y2="240" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
</svg>
