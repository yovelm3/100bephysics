<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" direction="ltr" role="img" aria-label="רפסודה על כרית אוויר נעה במהירות 3 מטר לשנייה, ונער עליה. הנער קופץ ממנה במהירות 4 מטר לשנייה ביחס לרפסודה, בניצב לכיוון תנועתה. משטח הרפסודה בגובה 1.25 מטר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="190" width="500" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="190" x2="530" y2="190" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="170" y="120" width="200" height="30" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<ellipse cx="270" cy="160" rx="110" ry="14" fill="var(--d-hatch)"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="260" cy="67.2" r="9.6"/><line x1="260" y1="76.8" x2="260" y2="100.8"/><line x1="260" y1="100.8" x2="249.2" y2="120"/><line x1="260" y1="100.8" x2="270.8" y2="120"/><line x1="245.6" y1="86.4" x2="274.4" y2="86.4"/></g>
<line x1="380" y1="135" x2="450" y2="135" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="460" y="139" text-anchor="start">3 m/s</text>
<line x1="150" y1="120" x2="150" y2="190" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="136" y="159" text-anchor="middle" transform="rotate(90.0 136 159)">1.25 m</text>
</svg>
