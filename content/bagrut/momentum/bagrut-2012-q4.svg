<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="מסילה חלקה ABCD: קטע אופקי AB, עלייה BC וקטע אופקי גבוה CD. קרונית 1 במסה 2 קילוגרם נעה ימינה לעבר קרונית 2 שבמנוחה. גרף הכוח של קרונית 1 על קרונית 2: משולש עד 10 בחזקת 4 ניוטון ב-0.5 אלפיות שנייה, וחזרה לאפס באלפית שנייה. ושלושה גרפי מהירות אפשריים">
