<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="גוש עץ במסה 9.98 קילוגרם תלוי בחוט באורך 2 מטר. קליע במסה 0.02 קילוגרם פוגע בו אופקית במהירות 500 מטר לשנייה ונתקע בו">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="220" y="8" width="120" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="220" y1="20" x2="340" y2="20" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="20" x2="280" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="290" y="90" text-anchor="start">2 m</text>
<rect x="255" y="150" width="50" height="40" rx="2" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="280" y="175" text-anchor="middle" style="fill:var(--d-label)">M</text>
<circle cx="120" cy="170" r="4" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="128" y1="170" x2="230" y2="170" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="170" y="160" text-anchor="middle">v = 500 m/s</text>
</svg>
