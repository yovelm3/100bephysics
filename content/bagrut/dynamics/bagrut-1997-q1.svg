<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="גוף על מדרון חלק בזווית 30 מעלות. מהירותו 12 מטר לשנייה במורד המדרון, וכוח F של 3.6 ניוטון פועל עליו במעלה המדרון. ציר x במורד המדרון">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<polygon points="60,210 480,210 60,50" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<rect x="40" y="210" width="460" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="210" x2="500" y2="210" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 433.3,192.2 A 50 50 0 0 0 430,210" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="411.2" y="202.3" text-anchor="middle">30°</text>
<rect x="208" y="96" width="44" height="26" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5" transform="rotate(20.9 230 109)"/>
<line x1="256" y1="103" x2="310" y2="124" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="322" y="123" text-anchor="start">12 m/s</text>
<line x1="206" y1="95" x2="150" y2="73" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="146" y="67" text-anchor="end">F = 3.6 N</text>
<circle cx="230" cy="131" r="3" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="228" y="151" text-anchor="middle">0</text>
<line x1="270" y1="155" x2="330" y2="178" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="338" y="185" text-anchor="start">x</text>
</svg>
