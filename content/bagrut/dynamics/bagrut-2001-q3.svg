<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="גוף A (שתי תיבות מודבקות) על שולחן, קשור בחוט שעובר על גלגלת לגוף B (תיבה אחת) שתלוי. וטבלת המהירות של A כל 0.02 שניות">
