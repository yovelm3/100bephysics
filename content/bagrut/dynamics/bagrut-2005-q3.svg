<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" direction="ltr" role="img" aria-label="גלגלת מחוברת לתקרה, וחבל כרוך סביבה. רמי (70 קילוגרם) עומד על הרצפה ואוחז קצה אחד. יעל (60 קילוגרם) תלויה במנוחה בקצה השני">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="180" y="8" width="200" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="180" y1="20" x2="380" y2="20" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="280" y1="20" x2="280" y2="40" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="280" cy="60" r="22" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="280" cy="60" r="2.5" fill="var(--d-line)" stroke="none" stroke-width="2"/>
<line x1="258" y1="60" x2="258" y2="200" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="302" y1="60" x2="302" y2="130" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="258" cy="198.4" r="11.2"/><line x1="258" y1="209.6" x2="258" y2="237.6"/><line x1="258" y1="237.6" x2="245.4" y2="260"/><line x1="258" y1="237.6" x2="270.6" y2="260"/><line x1="241.2" y1="220.8" x2="274.8" y2="220.8"/></g>
<text class="heb" x="220" y="250" text-anchor="middle" direction="rtl">רמי</text>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="302" cy="139.2" r="9.6"/><line x1="302" y1="148.8" x2="302" y2="172.8"/><line x1="302" y1="172.8" x2="291.2" y2="192"/><line x1="302" y1="172.8" x2="312.8" y2="192"/><line x1="287.6" y1="158.4" x2="316.4" y2="158.4"/></g>
<text class="heb" x="340" y="170" text-anchor="middle" direction="rtl">יעל</text>
<rect x="160" y="260" width="240" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="160" y1="260" x2="400" y2="260" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
</svg>
