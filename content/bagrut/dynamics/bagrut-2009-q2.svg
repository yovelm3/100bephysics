<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" direction="ltr" role="img" aria-label="תרשים א: שני גופים A ו-B צמודים זה לזה על משטח אופקי, וכוח F דוחף את A. תרשים ב: גוף B מונח על גוף A, וכוח F דוחף את A">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="110" width="230" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="110" x2="260" y2="110" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="108" y="66" width="44" height="44" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="130" y="93" text-anchor="middle" style="fill:#ffffff">A</text>
<rect x="154" y="74" width="36" height="36" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="172" y="97" text-anchor="middle" style="fill:#ffffff">B</text>
<line x1="60" y1="80" x2="106" y2="80" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="70" y="70" text-anchor="middle">F</text>
<text class="heb" x="150" y="140" text-anchor="middle" direction="rtl">תרשים א</text>
<rect x="300" y="190" width="230" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="300" y1="190" x2="530" y2="190" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="375" y="146" width="50" height="44" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="400" y="173" text-anchor="middle" style="fill:#ffffff">A</text>
<rect x="382" y="110" width="36" height="36" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="400" y="133" text-anchor="middle" style="fill:#ffffff">B</text>
<line x1="330" y1="160" x2="373" y2="160" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="340" y="150" text-anchor="middle">F</text>
<text class="heb" x="420" y="214" text-anchor="middle" direction="rtl">תרשים ב</text>
</svg>
