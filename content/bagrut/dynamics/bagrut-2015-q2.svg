<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" direction="ltr" role="img" aria-label="גוף על מדרון בזווית אלפא, וטבלת המדידות: מקדם החיכוך מ-0.10 עד 0.30 והתאוצה מ-2.5 עד 0.6 מטר לשנייה בריבוע">
<defs>
