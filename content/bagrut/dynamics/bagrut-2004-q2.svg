<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="מערכת גלגלות: גלגלת קבועה O1 תלויה מהתקרה בחוט S1, וגלגלת ניידת O2. חוט S3 עובר מיד האדם מעל O1, מתחת ל-O2 ועד התקרה. משקולת במסה 100 קילוגרם תלויה מ-O2 בחוט S2 ומונחת על הקרקע. האדם במסה 80 קילוגרם עומד על הקרקע">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="100" y="8" width="260" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="100" y1="20" x2="360" y2="20" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="220" y1="20" x2="220" y2="50" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="228" y="40" text-anchor="start">S₁</text>
<circle cx="220" cy="70" r="20" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="220" cy="70" r="2.5" fill="var(--d-line)" stroke="none" stroke-width="2"/>
<text class="label" x="220" y="100" text-anchor="middle">O₁</text>
<line x1="200" y1="70" x2="200" y2="230" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="192" y="150" text-anchor="end">S₃</text>
<line x1="240" y1="70" x2="240" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="248" y="120" text-anchor="start">S₃</text>
<circle cx="260" cy="160" r="20" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="260" cy="160" r="2.5" fill="var(--d-line)" stroke="none" stroke-width="2"/>
<text class="label" x="260" y="190" text-anchor="middle">O₂</text>
<line x1="280" y1="160" x2="280" y2="20" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="288" y="100" text-anchor="start">S₃</text>
<line x1="260" y1="180" x2="260" y2="240" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="268" y="214" text-anchor="start">S₂</text>
<rect x="225" y="243" width="70" height="34" rx="2" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="260" y="265" text-anchor="middle" style="fill:var(--d-label)">M = 100 kg</text>
<rect x="80" y="277" width="320" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="80" y1="277" x2="400" y2="277" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="200" cy="224.2" r="9.6"/><line x1="200" y1="233.8" x2="200" y2="257.8"/><line x1="200" y1="257.8" x2="189.2" y2="277"/><line x1="200" y1="257.8" x2="210.8" y2="277"/><line x1="185.6" y1="243.4" x2="214.4" y2="243.4"/></g>
<text class="label" x="160" y="250" text-anchor="end">m = 80 kg</text>
</svg>
