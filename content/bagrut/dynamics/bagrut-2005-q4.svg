<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="גוף A על משטח חלק, מחובר בחוט שעובר על גלגלת לגוף B שתלוי. התלמיד מושך את A ימינה בכוח F דרך מד-כוח. וטבלת התאוצה כפונקציה של הכוח">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="60" y="90" width="220" height="10" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="90" x2="280" y2="90" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="60" y1="90" x2="60" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="110" y="55" width="40" height="34" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="130" y="77" text-anchor="middle" style="fill:#ffffff">A</text>
<circle cx="48" cy="78" r="12" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="48" cy="78" r="2.5" fill="var(--d-line)" stroke="none" stroke-width="2"/>
<line x1="48" y1="66" x2="110" y2="66" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="36" y1="78" x2="36" y2="140" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="22" y="141" width="28" height="30" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
