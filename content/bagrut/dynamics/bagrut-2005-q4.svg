<rect x="176" y="60" width="48" height="24" rx="0" fill="none" stroke="var(--d-line)" stroke-width="1.2"/>
<line x1="224" y1="72" x2="270" y2="72" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="278" y="76" text-anchor="start">F</text>
<text class="heb" x="200" y="52" text-anchor="middle" direction="rtl">מד-כוח</text>
