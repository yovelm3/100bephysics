<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="קרונית במסה 6 קילוגרם על שולחן חלק, קשורה בחוט שעובר על גלגלת למשקולת במסה 4 קילוגרם. כוח אופקי F מושך את הקרונית שמאלה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="120" width="400" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="120" x2="440" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="440" y1="120" x2="440" y2="270" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<polygon points="210,82 330,82 318,112 222,112" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<text class="label" x="270" y="102" text-anchor="middle" style="fill:#ffffff">m</text>
<circle cx="236" cy="116" r="6" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="304" cy="116" r="6" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="450" cy="106" r="14" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="450" cy="106" r="2.5" fill="var(--d-line)" stroke="none" stroke-width="2"/>
<line x1="330" y1="92" x2="450" y2="92" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="464" y1="106" x2="464" y2="200" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="447" y="200" width="34" height="44" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="464" y="227" text-anchor="middle" style="fill:#ffffff">M</text>
<line x1="210" y1="92" x2="140" y2="92" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="130" y="96" text-anchor="end">F</text>
</svg>
