<polygon points="326,115.7 476.4,61 510.6,154.9 360.2,209.6" fill="none" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<line x1="401.2" y1="88.3" x2="401.2" y2="168.3" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="401.2" cy="174.3" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="401.2" y1="88.3" x2="428.6" y2="163.5" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
