<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="תרשים א: מכונית על כביש אופקי, ומשקולת תלויה ממד-כוח בתקרה, החוט נוטה בזווית אלפא מהאנך. תרשים ב: המכונית עולה בכביש משופע במהירות קבועה, והחוט אנכי">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="20" y="200" width="240" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="200" x2="260" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="50" y="70" width="180" height="110" rx="0" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="85" cy="192" r="9" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="195" cy="192" r="9" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="140" y1="70" x2="108" y2="140" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="120" y="86" width="10" height="24" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="106" cy="146" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="140" y1="70" x2="140" y2="140" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text class="label" x="130" y="132" text-anchor="end">α</text>
<text class="heb" x="140" y="236" text-anchor="middle" direction="rtl">תרשים א</text>
