<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" direction="ltr" role="img" aria-label="קפיץ אופקי שקצותיו קשורים לחוטים שעוברים על שתי גלגלות. בקצה כל חוט תלויה משקולת של 16 קילוגרם">
