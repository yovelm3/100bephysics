<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="מכונית על כביש אופקי. משקולת תלויה בחוט מהתקרה, והחוט נוטה בזווית קבועה של 30 מעלות מהאנך, כשהמשקולת מאחור">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="60" y="170" width="440" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="170" x2="500" y2="170" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="120" y="40" width="300" height="110" rx="0" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="170" cy="160" r="10" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="370" cy="160" r="10" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="300" y1="40" x2="260" y2="109.3" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="260" cy="109.3" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="300" y1="40" x2="300" y2="130" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<path d="M 285,66 A 30 30 0 0 0 300,70" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="288.6" y="87.5" text-anchor="middle">α</text>
</svg>
