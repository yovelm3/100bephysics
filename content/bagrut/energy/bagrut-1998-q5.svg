<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="קפיץ A מחובר לקיר, ונער מושך אותו בכוח של 20 ניוטון. הקפיץ מתארך ב-0.4 מטר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="48" y="40" width="12" height="120" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="40" x2="60" y2="160" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<polyline points="60,100 70,100 79.2,107 88.3,93 97.5,107 106.7,93 115.8,107 125,93 134.2,107 143.3,93 152.5,107 161.7,93 170.8,107 180,93 189.2,107 198.3,93 207.5,107 216.7,93 225.8,107 235,93 244.2,107 253.3,93 262.5,107 271.7,93 280.8,107 290,100 300,100" fill="none" stroke="var(--d-line)" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="300" y1="100" x2="380" y2="100" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="390" y="104" text-anchor="start">F = 20 N</text>
<line x1="220" y1="140" x2="300" y2="140" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="260" y="158" text-anchor="middle">0.4 m</text>
<text class="label" x="180" y="80" text-anchor="middle">A</text>
</svg>
