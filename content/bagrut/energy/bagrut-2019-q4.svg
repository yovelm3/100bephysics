<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" direction="ltr" role="img" aria-label="משטח ומאוורר: תיבה במסה 2 קילוגרם בנקודה A על הקרקע. המסילה עולה לקטע אופקי BD באורך 4 מטר בגובה 0.8 מטר. המאוורר בנקודה D מפעיל כוח F שמאלה. וגרף F כפונקציה של x: קו ישר מ-0 ב-B עד 8 ניוטון ב-4 מטר">
