<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="מסילה חסרת חיכוך ABCD: קטע אופקי AB, עלייה, וקטע אופקי CD בגובה 0.2 מטר מעל AB. קפיץ א מחובר בנקודה A לקיר, וקפיץ ב מחובר בנקודה D לקיר. תיבה מונחת ליד קפיץ א">
