<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" direction="ltr" role="img" aria-label="תרשים א: מסילה חלקה ABCD: הגוף בנקודה A בגובה 1 מטר מעל המשטח, במהירות 1 מטר לשנייה, יורד דרך B לנקודה הנמוכה C ועולה לראש גבעה D בגובה 1.5 מטר. תרשים ב: אותה מסילה, ובמקום הקטע העקום ABC קטע ישר משופע AB'C">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="380" y="200" width="330" height="8" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="380" y1="200" x2="710" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 430,80 Q 465,90 485,160 Q 505,200 530,200 Q 580,200 605,90 Q 620,40 630,40 Q 650,40 680,150" fill="none" stroke="var(--d-line)" stroke-width="2.6" stroke-linejoin="round"/>
<rect x="426" y="65" width="20" height="14" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5" transform="rotate(15 436 72)"/>
<line x1="444" y1="58" x2="470" y2="68" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="474" y="58" text-anchor="start">1 m/s</text>
<text class="label" x="422" y="84" text-anchor="end">A</text>
<text class="label" x="478" y="166" text-anchor="end">B</text>
<text class="label" x="530" y="218" text-anchor="middle">C</text>
<text class="label" x="630" y="32" text-anchor="middle">D</text>
<line x1="410" y1="80" x2="410" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="396" y="144" text-anchor="middle" transform="rotate(90.0 396 144)">1 m</text>
<line x1="700" y1="40" x2="700" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="686" y="124" text-anchor="middle" transform="rotate(90.0 686 124)">1.5 m</text>
<text class="heb" x="550" y="240" text-anchor="middle" direction="rtl">תרשים א</text>
<rect x="20" y="200" width="330" height="8" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="200" x2="350" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 70,80 Q 105,90 125,160 Q 145,200 170,200 Q 220,200 245,90 Q 260,40 270,40 Q 290,40 320,150" fill="none" stroke="var(--d-line)" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="70" y1="80" x2="170" y2="200" stroke="var(--d-line)" stroke-width="2.6" stroke-dasharray="6 4" stroke-linecap="round"/>
<text class="label" x="132" y="126" text-anchor="start">B'</text>
<rect x="66" y="65" width="20" height="14" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5" transform="rotate(15 76 72)"/>
<line x1="84" y1="58" x2="110" y2="68" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="114" y="58" text-anchor="start">1 m/s</text>
<text class="label" x="62" y="84" text-anchor="end">A</text>
<text class="label" x="118" y="166" text-anchor="end">B</text>
<text class="label" x="170" y="218" text-anchor="middle">C</text>
<text class="label" x="270" y="32" text-anchor="middle">D</text>
<line x1="50" y1="80" x2="50" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="36" y="144" text-anchor="middle" transform="rotate(90.0 36 144)">1 m</text>
<line x1="340" y1="40" x2="340" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="326" y="124" text-anchor="middle" transform="rotate(90.0 326 124)">1.5 m</text>
<text class="heb" x="190" y="240" text-anchor="middle" direction="rtl">תרשים ב</text>
</svg>
