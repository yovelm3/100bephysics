<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="מסילה ABCD: קטע משופע AB מנקודה A בגובה HA, קטע אופקי מחוספס BC, וקטע עקום CD שעולה לנקודה D. וטבלה של HA ומהירות הגוף בנקודה D">
<defs>
