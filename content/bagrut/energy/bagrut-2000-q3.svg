<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" direction="ltr" role="img" aria-label="נערה על גלגליות נעה על משטח אופקי ואחר כך עולה במשטח משופע בזווית אלפא. ציר x אופקי, ראשיתו בתחילת המשטח המשופע, והנקודה A ב-x = 1.6 מטר. וטבלת האנרגיה הקינטית בשלוש נקודות">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="30" y1="160" x2="160" y2="160" stroke="var(--d-line)" stroke-width="2.5" stroke-linecap="round"/>
<line x1="160" y1="160" x2="420" y2="80" stroke="var(--d-line)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 200,160 A 40 40 0 0 0 198.3,148.3" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="213.4" y="157" text-anchor="middle">α</text>
<line x1="160" y1="182" x2="440" y2="182" stroke="var(--d-line)" stroke-width="1.4" marker-end="url(#f-axis)"/>
<text class="label" x="446" y="186" text-anchor="start">x (m)</text>
<text class="dim" x="160" y="198" text-anchor="middle">0</text>
<text class="dim" x="368" y="198" text-anchor="middle">1.6</text>
<circle cx="368" cy="96" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="372" y="88" text-anchor="start">A</text>
<line x1="368" y1="96" x2="368" y2="182" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="80" cy="120.4" r="7.2"/><line x1="80" y1="127.6" x2="80" y2="145.6"/><line x1="80" y1="145.6" x2="71.9" y2="160"/><line x1="80" y1="145.6" x2="88.1" y2="160"/><line x1="69.2" y1="134.8" x2="90.8" y2="134.8"/></g>
<rect x="300" y="20" width="250" height="52" rx="0" fill="none" stroke="var(--d-line)" stroke-width="1.2"/>
<line x1="300" y1="46" x2="550" y2="46" stroke="var(--d-line)" stroke-width="1" stroke-linecap="round"/>
<line x1="400" y1="20" x2="400" y2="72" stroke="var(--d-line)" stroke-width="1" stroke-linecap="round"/>
<text class="label" x="350" y="38" text-anchor="middle">Ek (J)</text>
<text class="label" x="350" y="64" text-anchor="middle">x (m)</text>
<text class="dim" x="425" y="38" text-anchor="middle">260</text>
<text class="dim" x="425" y="64" text-anchor="middle">0.4</text>
<text class="dim" x="475" y="38" text-anchor="middle">200</text>
<text class="dim" x="475" y="64" text-anchor="middle">0.8</text>
<text class="dim" x="525" y="38" text-anchor="middle">140</text>
<text class="dim" x="525" y="64" text-anchor="middle">1.2</text>
</svg>
