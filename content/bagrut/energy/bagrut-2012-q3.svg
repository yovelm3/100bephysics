<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="מסילה חלקה AB על שולחן בגובה H: הקצה A בגובה h מעל השולחן, והקצה B אופקי בקצה השולחן. כדור נורה מ-A במורד המסילה במהירות v0 ונוחת במרחק x. וגרף x בריבוע כפונקציה של h: קו ישר מ-1 ב-h=0 עד 11 ב-h=2 מטר">
