<rect x="263" y="132" width="34" height="28" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="280" y="151" text-anchor="middle" style="fill:#ffffff">2 kg</text>
<line x1="254" y1="234" x2="243.6" y2="280" stroke="var(--d-accent, var(--d-body))" stroke-width="1.6" stroke-linecap="round"/>
