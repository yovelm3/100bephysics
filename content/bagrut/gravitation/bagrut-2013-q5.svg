<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 480 280" role="img" aria-label="מסלול אליפטי סביב כדור הארץ. כדור הארץ קרוב לקצה הימני של האליפסה, ליד הנקודה A. הנקודות על המסלול: A בקצה הימני, B בתחתית, C בקצה השמאלי, D למעלה משמאל, E למעלה באמצע">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<path d="M 60 140 A 170 100 0 1 0 400 140 A 170 100 0 1 0 60 140" fill="none" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="367.5" cy="140" r="16" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="357.5" y="114" text-anchor="middle" direction="rtl">כדור הארץ</text>
<circle cx="400" cy="140" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="414" y="145" text-anchor="middle">A</text>
<circle cx="230" cy="240" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="230" y="262" text-anchor="middle">B</text>
<circle cx="60" cy="140" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="46" y="145" text-anchor="middle">C</text>
<circle cx="120.7" cy="63.4" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="108.7" y="55.4" text-anchor="middle">D</text>
<circle cx="224.1" cy="40.1" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="224.1" y="28.1" text-anchor="middle">E</text>
</svg>
