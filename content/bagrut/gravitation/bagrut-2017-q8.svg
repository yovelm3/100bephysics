<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" direction="ltr" role="img" aria-label="כדור הארץ (מסה M1, רדיוס R) משמאל והירח (מסה M2) מימין. הנקודה A על פני כדור הארץ, על הקו המחבר את המרכזים. הנקודה O על הקו, קרובה לירח. המרחק בין המרכזים d">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="110" cy="95" r="55" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="110" y="29" text-anchor="middle" direction="rtl">כדור הארץ</text>
<text class="label" x="100" y="173" text-anchor="middle">M₁</text>
<circle cx="470" cy="95" r="18" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="470" y="67" text-anchor="middle" direction="rtl">הירח</text>
<text class="label" x="482" y="135" text-anchor="middle">M₂</text>
<circle cx="110" cy="95" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="470" cy="95" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="110" y1="95" x2="470" y2="95" stroke="var(--d-line)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="110" y1="83" x2="165" y2="83" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="137.5" y="99" text-anchor="middle">R</text>
<circle cx="165" cy="95" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="176" y="87" text-anchor="start">A</text>
<circle cx="434" cy="95" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="434" y="83" text-anchor="middle">O</text>
<line x1="110" y1="117" x2="470" y2="117" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="290" y="141" text-anchor="middle">d</text>
</svg>
