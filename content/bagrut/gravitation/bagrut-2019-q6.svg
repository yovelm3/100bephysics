<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="למעלה: כדור הארץ, המרכז, נקודה D על הקו לירח, המרחק rE ממרכז כדור הארץ ל-D, והמרחק rM מ-D למרכז הירח. למטה: ארבעה גרפים של שקול כוחות הכבידה כפונקציה של המרחק r ממרכז כדור הארץ. גרף 1: קבוע וחיובי ואז קפיצה לשלילי. גרף 2: יורד מערך חיובי גדול ליד כדור הארץ, חוצה את האפס, ושואף לערך שלילי גדול ליד הירח. גרף 3: קו ישר יורד. גרף 4: יורד מערך חיובי גדול לערך שלילי קטן וקבוע כמעט">
<defs>
