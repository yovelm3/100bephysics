<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="כוכב שמרכזו O ורדיוסו R, וחללית במרחק H מפני הכוכב. מהחללית הכוכב נראה בזווית ראייה של 60 מעלות">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="160" cy="110" r="90" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="160" cy="110" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="150" y="118" text-anchor="end">O</text>
<line x1="160" y1="110" x2="250" y2="110" stroke="var(--d-line)" stroke-width="1.2" stroke-linecap="round"/>
<text class="dim" x="205" y="102" text-anchor="middle">R</text>
<line x1="250" y1="110" x2="340" y2="110" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="295" y="128" text-anchor="middle">H</text>
<circle cx="350" cy="110" r="8" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="350" y="140" text-anchor="middle" direction="rtl">חללית</text>
<text class="heb" x="160" y="214" text-anchor="middle" direction="rtl">כוכב</text>
<line x1="342" y1="110" x2="115" y2="32" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="342" y1="110" x2="115" y2="188" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M 316,95 A 30 30 0 0 0 316,125" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="298" y="115" text-anchor="middle">60°</text>
</svg>
