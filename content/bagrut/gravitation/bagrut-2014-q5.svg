<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" direction="ltr" role="img" aria-label="שמאל: מאדים ושני מסלולים מעגליים, של פובוס (פנימי) ושל דימוס (חיצוני). ימין: חללית מרחפת 20 מטר מעל קרקע מאדים, ומטאורואיד נע אופקית לעברה במהירות 12.5 מטר לשנייה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="120" cy="115" r="26" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="120" y="120" text-anchor="middle" direction="rtl">מאדים</text>
<circle cx="120" cy="115" r="52" fill="none" stroke="var(--d-line)" stroke-width="1.1" stroke-dasharray="4 4"/>
<circle cx="172" cy="115" r="4" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="heb" x="182" y="119" text-anchor="end" direction="rtl">פובוס</text>
<circle cx="120" cy="115" r="96" fill="none" stroke="var(--d-line)" stroke-width="1.1" stroke-dasharray="4 4"/>
<circle cx="52" cy="47" r="4" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="heb" x="50" y="33" text-anchor="middle" direction="rtl">דימוס</text>
<rect x="300" y="200" width="240" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="300" y1="200" x2="540" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="450" y="88" width="40" height="24" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="470" y="105" text-anchor="middle" style="fill:#ffffff">53 kg</text>
<line x1="520" y1="112" x2="520" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="506" y="160" text-anchor="middle" transform="rotate(90.0 506 160)">20 m</text>
<circle cx="350" cy="100" r="7" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<line x1="362" y1="100" x2="412" y2="100" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="390" y="88" text-anchor="middle">12.5 m/s</text>
<text class="label" x="350" y="125" text-anchor="middle">1.3 kg</text>
</svg>
