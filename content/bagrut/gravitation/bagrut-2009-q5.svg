<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-label="למעלה: ארבעה תרשימים של חללית מעל כוכב לכת. א: חרטום כלפי מעלה והסילון כלפי הכוכב. ב: חרטום כלפי הכוכב והסילון כלפי מעלה. ג: החללית אופקית והסילון הצידה. ד: חרטום כלפי מעלה, המנוע כבוי. למטה: מרכז הכוכב O, רדיוס R, החללית בגובה H מעל פני הכוכב, ושני קווים משיקים ביניהם זווית של 60 מעלות">
