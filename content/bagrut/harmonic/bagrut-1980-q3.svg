<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 186" role="img" aria-label="שולחן אופקי חלק. קפיץ שקצהו השמאלי מחובר לקיר, ולקצהו הימני מוצמדת מסה m של 2 קילוגרם. הקפיץ מתוח 10 סנטימטר משיווי משקל">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="120" width="480" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="120" x2="520" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="48" y="40" width="12" height="80" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="40" x2="60" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<polyline points="60,98 70,98 81,105 92,91 103,105 114,91 125,105 136,91 147,105 158,91 169,105 180,91 191,105 202,91 213,105 224,91 235,105 246,91 257,105 268,91 279,105 290,98 300,98" fill="none" stroke="var(--d-line)" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="300" y="76" width="50" height="44" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<text class="label" x="325" y="103" text-anchor="middle" style="fill:#ffffff">m</text>
<line x1="250" y1="60" x2="250" y2="122" stroke="var(--d-line)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/>
<text class="heb" x="250" y="54" text-anchor="middle" direction="rtl">שיווי משקל</text>
<line x1="250" y1="146" x2="300" y2="146" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="275" y="170" text-anchor="middle">10 cm</text>
</svg>
