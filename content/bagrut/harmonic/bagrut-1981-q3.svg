<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 480 260" role="img" aria-label="מטוטלת: חוט באורך l תלוי מהתקרה, ובקצהו מסה נקודתית m. החוט מוסט בזווית קטנה θ מהאנך">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="120" y="18" width="120" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="120" y1="30" x2="240" y2="30" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="180" y1="30" x2="180" y2="230" stroke="var(--d-line)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/>
<line x1="180" y1="30" x2="226" y2="214.4" stroke="var(--d-line)" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="226" cy="214.4" r="9" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="244" y="218.4" text-anchor="start">m</text>
<path d="M 180,80 A 50 50 0 0 0 192.1,78.5" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="187.8" y="98.5" text-anchor="middle">θ</text>
<text class="label" x="214" y="140" text-anchor="start">ℓ</text>
