<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" direction="ltr" role="img" aria-label="גרף הכוח F בניוטון כפונקציה של ההעתק x במטרים: קו ישר יורד מ-8 ניוטון ב-x של מינוס 0.2 מטר, דרך הראשית, עד מינוס 8 ניוטון ב-x של 0.2 מטר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="60" y1="26" x2="60" y2="224" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="160" y1="26" x2="160" y2="224" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="360" y1="26" x2="360" y2="224" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="460" y1="26" x2="460" y2="224" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="40" y1="213" x2="480" y2="213" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="40" y1="37" x2="480" y2="37" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="10" y1="125" x2="510" y2="125" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-arr)" stroke-linecap="round"/>
<line x1="260" y1="235" x2="260" y2="9.5" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-arr)" stroke-linecap="round"/>
<text class="label" x="510" y="115" text-anchor="end">x (m)</text>
<text class="label" x="270" y="13.5" text-anchor="start">F (N)</text>
<text class="dim" x="60" y="143" text-anchor="middle">-0.2</text>
<text class="dim" x="160" y="143" text-anchor="middle">-0.1</text>
<text class="dim" x="360" y="143" text-anchor="middle">0.1</text>
<text class="dim" x="460" y="143" text-anchor="middle">0.2</text>
<text class="dim" x="252" y="217" text-anchor="end">-8</text>
<text class="dim" x="252" y="41" text-anchor="end">8</text>
<polyline points="60,37 460,213" fill="none" stroke="var(--d-body)" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
