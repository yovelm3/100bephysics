<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-label="חישוק אנכי שמרכזו O ורדיוסו R. B בראש החישוק ו-C בתחתיתו. חרוז בנקודה A על החישוק, כשהרדיוס אליה יוצר זווית θ עם האנך">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="150" cy="140" r="115" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<line x1="150" y1="25" x2="150" y2="255" stroke="var(--d-line)" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/>
<text class="label" x="150" y="17" text-anchor="middle">B</text>
<text class="label" x="150" y="275" text-anchor="middle">C</text>
<line x1="150" y1="140" x2="92.5" y2="239.6" stroke="var(--d-line)" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="92.5" cy="239.6" r="7" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="78.5" y="255.6" text-anchor="middle">A</text>
<path d="M 133,169.4 A 34 34 0 0 0 150,174" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="137.6" y="191.4" text-anchor="middle">θ</text>
<text class="label" x="107.2" y="189.8" text-anchor="middle">R</text>
<circle cx="150" cy="140" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="160" y="134" text-anchor="start">O</text>
</svg>
