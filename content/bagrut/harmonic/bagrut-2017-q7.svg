<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="קרונית על משטח אופקי, קשורה לקפיץ אופקי שקצהו השני מחובר לקיר. נקודת שיווי המשקל O, הנקודה A 10 סנטימטר מימין, והנקודה B משמאל">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="120" width="460" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="120" x2="490" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="38" y="40" width="12" height="80" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="50" y1="40" x2="50" y2="120" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<polyline points="50,96 60,96 71.5,103 83,89 94.5,103 106,89 117.5,103 129,89 140.5,103 152,89 163.5,103 175,89 186.5,103 198,89 209.5,103 221,89 232.5,103 244,89 255.5,103 267,89 278.5,103 290,96 300,96" fill="none" stroke="var(--d-line)" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="295" y="90" width="80" height="22" rx="6" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="331" y="76" width="28" height="16" rx="4" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="311" cy="112" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="359" cy="112" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="200" y1="122" x2="200" y2="132" stroke="var(--d-line)" stroke-width="1.4" stroke-linecap="round"/>
<text class="label" x="200" y="148" text-anchor="middle">B</text>
<line x1="270" y1="122" x2="270" y2="132" stroke="var(--d-line)" stroke-width="1.4" stroke-linecap="round"/>
<text class="label" x="270" y="148" text-anchor="middle">O</text>
<line x1="340" y1="122" x2="340" y2="132" stroke="var(--d-line)" stroke-width="1.4" stroke-linecap="round"/>
<text class="label" x="340" y="148" text-anchor="middle">A</text>
<line x1="270" y1="30" x2="340" y2="30" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="305" y="48" text-anchor="middle">10 cm</text>
</svg>
