<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" direction="ltr" role="img" aria-label="עגלה שמסתה m נעה ימינה במהירות v של 3 מטר לשנייה על משטח אופקי, לעבר קפיץ אופקי שקבועו k המחובר לקיר מימין">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="30" y="130" width="460" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="30" y1="130" x2="490" y2="130" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="490" y="50" width="12" height="80" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="490" y1="50" x2="490" y2="130" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="80" y="100" width="120" height="22" rx="6" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="134" y="86" width="42" height="16" rx="4" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="104" cy="122" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="176" cy="122" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="140" y="78" text-anchor="middle">m</text>
<line x1="100" y1="50" x2="170" y2="50" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="135" y="40" text-anchor="middle">v = 3 m/s</text>
<polyline points="300,104 310,104 318.5,114 327,94 335.5,114 344,94 352.5,114 361,94 369.5,114 378,94 386.5,114 395,94 403.5,114 412,94 420.5,114 429,94 437.5,114 446,94 454.5,114 463,94 471.5,114 480,104 490,104" fill="none" stroke="var(--d-line)" stroke-width="1.8" stroke-linejoin="round"/>
<text class="label" x="400" y="80" text-anchor="middle">k = 30 N/m</text>
</svg>
