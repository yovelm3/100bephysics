<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="כדור על קצה גג בניין בגובה 5 מטר נזרק אופקית במהירות v0">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="250" width="560" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="0" y1="250" x2="560" y2="250" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="110" y="90" width="90" height="160" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="122" y1="120" x2="188" y2="120" stroke="var(--d-hatch)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="122" y1="155" x2="188" y2="155" stroke="var(--d-hatch)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="122" y1="190" x2="188" y2="190" stroke="var(--d-hatch)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="122" y1="225" x2="188" y2="225" stroke="var(--d-hatch)" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="194" cy="81" r="9" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="194" y="63" text-anchor="middle">m = 0.1 kg</text>
<line x1="206" y1="81" x2="272" y2="81" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="278" y="85" text-anchor="start">v₀ = 5 m/s</text>
<line x1="85" y1="90" x2="85" y2="250" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="71" y="174" text-anchor="middle" transform="rotate(90.0 71 174)">5 m</text>
</svg>
