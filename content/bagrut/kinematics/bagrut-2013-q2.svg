<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="גוף נופל ממנוחה מראש מגדל גבוה. עליו פועלים כוח הכובד כלפי מטה וכוח החיכוך עם האוויר כלפי מעלה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="60" y="200" width="440" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="200" x2="500" y2="200" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="120" y="30" width="60" height="170" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="230" cy="90" r="10" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<line x1="230" y1="102" x2="230" y2="160" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="242" y="146" text-anchor="start">mg</text>
<line x1="230" y1="78" x2="230" y2="40" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="242" y="52" text-anchor="start">f = kv²</text>
<line x1="205" y1="120" x2="205" y2="150" stroke="var(--d-dim)" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<text class="dim" x="198" y="140" text-anchor="end">v</text>
</svg>
