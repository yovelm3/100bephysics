<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" direction="ltr" role="img" aria-label="אבן נזרקת אנכית כלפי מעלה מהקרקע במהירות 40 מטר לשנייה, ולידה אדם בכדור פורח שעולה במהירות קבועה של 10 מטר לשנייה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="240" width="560" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="0" y1="240" x2="560" y2="240" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="200" cy="230" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<line x1="200" y1="218" x2="200" y2="140" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="212" y="176" text-anchor="start">v₀ = 40 m/s</text>
<circle cx="400" cy="90" r="42" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="376" y1="124" x2="388" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="424" y1="124" x2="412" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="386" y="150" width="28" height="20" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="450" y1="160" x2="450" y2="110" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="460" y="140" text-anchor="start">10 m/s</text>
</svg>
