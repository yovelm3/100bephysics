<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="קשת וחץ בגובה 1.8 מטר מעל הקרקע, ותפוח באותו גובה במרחק 6 מטר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="220" width="480" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="220" x2="520" y2="220" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 100,58 Q 140,100 100,142" fill="none" stroke="var(--d-line)" stroke-width="3" stroke-linejoin="round"/>
<line x1="100" y1="58" x2="100" y2="142" stroke="var(--d-line)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="100" y1="100" x2="150" y2="100" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<circle cx="440" cy="100" r="9" fill="#c2410c" stroke="none" stroke-width="2"/>
<line x1="440" y1="91" x2="440" y2="84" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="heb" x="440" y="76" text-anchor="middle" direction="rtl">תפוח</text>
<text class="heb" x="100" y="46" text-anchor="middle" direction="rtl">קשת</text>
<text class="heb" x="480" y="240" text-anchor="middle" direction="rtl">קרקע</text>
<line x1="100" y1="100" x2="100" y2="55" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="440" y1="100" x2="440" y2="55" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="100" y1="60" x2="440" y2="60" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="270" y="50" text-anchor="middle">6 m</text>
<line x1="300" y1="100" x2="300" y2="220" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="286" y="164" text-anchor="middle" transform="rotate(90.0 286 164)">1.8 m</text>
<line x1="150" y1="100" x2="430" y2="100" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/>
</svg>
