<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" direction="ltr" role="img" aria-label="בניין בגובה 45 מטר. כדור A נזרק מהגג כלפי מעלה במהירות 40 מטר לשנייה, וכדור B נזרק מרגלי הבניין כלפי מעלה במהירות 55 מטר לשנייה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="80" y="250" width="400" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="80" y1="250" x2="480" y2="250" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="200" y="100" width="50" height="150" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="180" y1="100" x2="180" y2="250" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="166" y="179" text-anchor="middle" transform="rotate(90.0 166 179)">45 m</text>
<circle cx="262" cy="92" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="262" y="122" text-anchor="middle">A</text>
<line x1="262" y1="80" x2="262" y2="30" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="274" y="50" text-anchor="start">40 m/s</text>
<circle cx="330" cy="241" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="346" y="246" text-anchor="start">B</text>
<line x1="330" y1="229" x2="330" y2="170" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="342" y="196" text-anchor="start">55 m/s</text>
</svg>
