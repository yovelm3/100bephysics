<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 225" direction="ltr" role="img" aria-label="שוטר על אופנוע עומד בצד כביש ישר. מכונית חולפת על פניו במהירות קבועה של 108 קמ&quot;ש. כשהמכונית במרחק 87.5 מטר ממנו, השוטר יוצא לדרך בתאוצה קבועה של 4 מטר לשנייה בריבוע">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="20" y="150" width="520" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="150" x2="540" y2="150" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<text class="heb" x="90" y="182" text-anchor="middle" direction="rtl">שוטר על אופנוע</text>
<text class="heb" x="420" y="182" text-anchor="middle" direction="rtl">מכונית</text>
<line x1="20" y1="120" x2="540" y2="120" stroke="var(--d-hatch)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>
<g stroke="var(--d-line)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 63,139.9 L 81,125.9 L 103.5,125.9 L 117,139.9"/><path d="M 110.2,129.9 L 105.8,115.9 L 112.5,113.9"/></g>
<path d="M 72,125.9 Q 85.5,113.9 103.5,121.9 L 103.5,127.9 L 72,127.9 Z" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="63" cy="139.9" r="10.1" fill="none" stroke="var(--d-label)" stroke-width="3"/>
<circle cx="63" cy="139.9" r="2.2" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="117" cy="139.9" r="10.1" fill="none" stroke="var(--d-label)" stroke-width="3"/>
<circle cx="117" cy="139.9" r="2.2" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="90" cy="89.9" r="7.3" fill="var(--d-fill)"/><path d="M 87.8,96.9 L 81,117.9 L 94.5,127.9"/><path d="M 85.5,103.9 L 108,113.9"/></g>
<text class="label" x="90" y="70" text-anchor="middle">a = 4 m/s²</text>
<rect x="380" y="120" width="80" height="22" rx="6" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="416" y="106" width="28" height="16" rx="4" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="396" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="444" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="468" y1="120" x2="520" y2="120" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="494" y="108" text-anchor="middle">108 km/h</text>
<line x1="90" y1="200" x2="420" y2="200" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="255" y="218" text-anchor="middle">87.5 m</text>
</svg>
