<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="שוטר על אופנוע עומד בצד כביש ישר. מכונית חולפת על פניו במהירות קבועה של 108 קמ&quot;ש. כשהמכונית במרחק 87.5 מטר ממנו, השוטר יוצא לדרך בתאוצה קבועה של 4 מטר לשנייה בריבוע">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="20" y="150" width="520" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="150" x2="540" y2="150" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="20" y1="120" x2="540" y2="120" stroke="var(--d-hatch)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>
<rect x="60" y="120" width="60" height="22" rx="6" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="87" y="106" width="21" height="16" rx="4" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="72" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="108" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="90" y="98" text-anchor="middle">a = 4 m/s²</text>
<rect x="380" y="120" width="80" height="22" rx="6" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="416" y="106" width="28" height="16" rx="4" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5"/>
<circle cx="396" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="444" cy="142" r="8" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="468" y1="120" x2="520" y2="120" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="494" y="108" text-anchor="middle">108 km/h</text>
<line x1="90" y1="172" x2="420" y2="172" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="255" y="190" text-anchor="middle">87.5 m</text>
</svg>
