<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="מיקומי שתי משאיות בהפרשי זמן שווים לאורך הקטע MN. משאית A: חמישה מרווחים, שניים מ-M עד P ושלושה מ-P עד N. משאית B: שישה מרווחים שווים">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="100" y1="50" x2="500" y2="50" stroke="var(--d-line)" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="110" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="206.1" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="300" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="392" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="426.2" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="490" cy="50" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="110" y="72" text-anchor="middle">M</text>
<text class="label" x="300" y="72" text-anchor="middle">P</text>
<text class="label" x="490" y="72" text-anchor="middle">N</text>
<text class="heb" x="90" y="55" text-anchor="start" direction="rtl">משאית A</text>
<line x1="100" y1="130" x2="500" y2="130" stroke="var(--d-line)" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="110" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="173.3" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="236.7" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="300" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="363.3" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="426.7" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<circle cx="490" cy="130" r="5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="110" y="152" text-anchor="middle">M</text>
<text class="label" x="300" y="152" text-anchor="middle">P</text>
<text class="label" x="490" y="152" text-anchor="middle">N</text>
<text class="heb" x="90" y="135" text-anchor="start" direction="rtl">משאית B</text>
</svg>
