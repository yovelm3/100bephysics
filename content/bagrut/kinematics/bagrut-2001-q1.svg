<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="תלמיד על גג בניין משחרר את כדור א ממנוחה, ושנייה אחר כך זורק את כדור ב כלפי מטה במהירות 14 מטר לשנייה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="60" y="280" width="460" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="280" x2="520" y2="280" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="150" y="40" width="80" height="240" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="258" cy="4.8" r="6.4"/><line x1="258" y1="11.2" x2="258" y2="27.2"/><line x1="258" y1="27.2" x2="250.8" y2="40"/><line x1="258" y1="27.2" x2="265.2" y2="40"/><line x1="248.4" y1="17.6" x2="267.6" y2="17.6"/></g>
<circle cx="290" cy="60" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="304" y="56" text-anchor="start">ב</text>
<line x1="290" y1="72" x2="290" y2="112" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="302" y="100" text-anchor="start">14 m/s</text>
<circle cx="290" cy="160" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="304" y="156" text-anchor="start">א</text>
<line x1="290" y1="172" x2="290" y2="205" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<line x1="380" y1="40" x2="380" y2="250" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<text class="label" x="390" y="250" text-anchor="start">y</text>
<text class="label" x="390" y="44" text-anchor="start">0</text>
</svg>
