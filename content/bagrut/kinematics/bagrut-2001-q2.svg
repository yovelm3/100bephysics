<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="כדור פורח עולה במהירות 5 מטר לשנייה ונסחף אופקית במהירות 4.5 מטר לשנייה. אבן משתחררת מתחתית הסל בנקודה A, בגובה 4 מטר מעל הנקודה P שעל הקרקע, ופוגעת בקרקע בנקודה Q">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="290" width="480" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="290" x2="520" y2="290" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="200" cy="80" r="55" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="168" y1="124" x2="186" y2="160" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="232" y1="124" x2="214" y2="160" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<rect x="186" y="160" width="28" height="22" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<circle cx="200" cy="190" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="212" y="196" text-anchor="start">A</text>
<line x1="150" y1="190" x2="150" y2="290" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="136" y="244" text-anchor="middle" transform="rotate(90.0 136 244)">4 m</text>
<line x1="110" y1="140" x2="110" y2="90" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="100" y="120" text-anchor="end">5 m/s</text>
<line x1="270" y1="110" x2="330" y2="110" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="300" y="100" text-anchor="middle">4.5 m/s</text>
<text class="label" x="200" y="312" text-anchor="middle">P</text>
<circle cx="200" cy="290" r="3" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="420" y="312" text-anchor="middle">Q</text>
<circle cx="420" cy="290" r="3" fill="var(--d-label)" stroke="none" stroke-width="2"/>
</svg>
