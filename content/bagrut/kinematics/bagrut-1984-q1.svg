<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" direction="ltr" role="img" aria-label="גרף מהירות-זמן של רקטה: עלייה קווית ל-200 מטר לשנייה ב-10 שניות, ירידה קווית לאפס ב-30 שניות, ואחר כך ירידה איטית לערכים שליליים קטנים">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<line x1="163.3" y1="220" x2="163.3" y2="50" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="256.7" y1="220" x2="256.7" y2="50" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="350" y1="220" x2="350" y2="50" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="123.9" x2="490" y2="123.9" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="50" x2="490" y2="50" stroke="var(--d-hatch)" stroke-width="1" stroke-linecap="round"/>
<line x1="70" y1="197.8" x2="508" y2="197.8" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<line x1="70" y1="226" x2="70" y2="32" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<line x1="163.3" y1="193.8" x2="163.3" y2="201.8" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="163.3" y="215.8" text-anchor="middle">10</text>
<line x1="256.7" y1="193.8" x2="256.7" y2="201.8" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="256.7" y="215.8" text-anchor="middle">20</text>
<line x1="350" y1="193.8" x2="350" y2="201.8" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="350" y="215.8" text-anchor="middle">30</text>
<line x1="66" y1="123.9" x2="74" y2="123.9" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="62" y="127.9" text-anchor="end">100</text>
<line x1="66" y1="50" x2="74" y2="50" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="62" y="54" text-anchor="end">200</text>
<text class="label" x="506" y="187.8" text-anchor="end">t (s)</text>
<text class="label" x="80" y="44" text-anchor="start">v (m/s)</text>
<polyline points="70,197.8 163.3,50 350,197.8 490,198.4" fill="none" stroke="var(--d-body)" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="163.3" y1="50" x2="163.3" y2="197.8" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="163.3" y1="50" x2="70" y2="50" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
</svg>
