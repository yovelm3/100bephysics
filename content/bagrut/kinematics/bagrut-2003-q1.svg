<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="שתי אבנים נזרקות אנכית כלפי מעלה מאותה נקודה על הקרקע: הראשונה ב-t=0 במהירות v1, השנייה ב-t=T במהירות v2">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="60" y="190" width="440" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="190" x2="500" y2="190" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="250" cy="120" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="264" y="124" text-anchor="start">1</text>
<line x1="250" y1="108" x2="250" y2="70" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="262" y="88" text-anchor="start">v₁</text>
<circle cx="320" cy="182" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="334" y="186" text-anchor="start">2</text>
<line x1="320" y1="170" x2="320" y2="120" stroke="var(--d-label)" stroke-width="2.4" marker-end="url(#f-arr)"/>
<text class="label" x="332" y="146" text-anchor="start">v₂</text>
<line x1="140" y1="190" x2="140" y2="30" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<text class="label" x="150" y="34" text-anchor="start">y</text>
<text class="label" x="132" y="196" text-anchor="end">0</text>
</svg>
