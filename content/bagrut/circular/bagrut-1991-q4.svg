<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="מטוטלת קונית: גוף m בקצה חוט באורך ℓ שקשור לנקודה A, ונע במעגל אופקי. החוט נוטה בזווית אלפא מהאנך, ו-h המרחק מ-A למרכז המעגל">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="330" cy="30" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="330" y="20" text-anchor="middle">A</text>
<ellipse cx="330" cy="230" rx="170" ry="26" fill="none" stroke="var(--d-dim)" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="330" y1="30" x2="175" y2="238" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="172" cy="240" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="160" y="262" text-anchor="middle">m</text>
<line x1="330" y1="30" x2="330" y2="230" stroke="var(--d-dim)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="360" y1="30" x2="360" y2="230" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="346" y="134" text-anchor="middle" transform="rotate(90.0 346 134)">h</text>
<path d="M 299.9,69.9 A 50 50 0 0 0 330,80" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="309.7" y="95.7" text-anchor="middle">α</text>
<text class="label" x="238" y="120" text-anchor="end">ℓ</text>
</svg>
