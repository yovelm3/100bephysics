<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="דסקה מסתובבת ומטבע עליה: תרשים א מבט מהצד, תרשים ב מבט משופע. וגרף: כוח החיכוך על המטבע כפונקציה של ריבוע התדירות: עולה בקו ישר עד הנקודה B מעל A, ואחר כך קבוע ונמוך יותר עד D">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<ellipse cx="140" cy="80" rx="110" ry="30" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<rect x="134" y="74" width="12" height="10" rx="0" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<ellipse cx="190" cy="80" rx="10" ry="4" fill="var(--d-label)"/>
<line x1="140" y1="20" x2="140" y2="74" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text class="heb" x="140" y="14" text-anchor="middle" direction="rtl">ציר הדסקה</text>
<text class="heb" x="140" y="132" text-anchor="middle" direction="rtl">תרשים ב</text>
<rect x="40" y="200" width="200" height="10" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="140" y1="160" x2="140" y2="250" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="186" y="194" width="22" height="6" rx="0" fill="var(--d-label)" stroke="none" stroke-width="0"/>
<path d="M 128,176 A 12 5 0 1 0 152,176" fill="none" stroke="var(--d-line)" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#f-arr)"/>
<text class="heb" x="140" y="270" text-anchor="middle" direction="rtl">מבט צד</text>
<text class="heb" x="140" y="290" text-anchor="middle" direction="rtl">תרשים א</text>
<line x1="330" y1="260" x2="528" y2="260" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<line x1="330" y1="260" x2="330" y2="62" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-axis)"/>
<text class="label" x="526" y="250" text-anchor="end">f² (Hz²)</text>
<text class="label" x="340" y="74" text-anchor="start">F (N)</text>
<polyline points="330,260 411,116" fill="none" stroke="var(--d-body)" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="411" y1="116" x2="411" y2="152" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<polyline points="411,152 483,152" fill="none" stroke="var(--d-body)" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="411" y1="152" x2="411" y2="260" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="330" y1="116" x2="411" y2="116" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="483" y1="152" x2="483" y2="260" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text class="label" x="411" y="278" text-anchor="middle">A</text>
<text class="label" x="483" y="278" text-anchor="middle">D</text>
<text class="label" x="320" y="120" text-anchor="end">B</text>
<text class="label" x="322" y="274" text-anchor="end">O</text>
</svg>
