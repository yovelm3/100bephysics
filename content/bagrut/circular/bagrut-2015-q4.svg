<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" direction="ltr" role="img" aria-label="מטוטלת: כדור קטן במסה m על חוט באורך L. נקודה 3 היא נקודת שיווי המשקל, ונקודה 1 בגובה h מעליה. חמש נקודות 1 עד 5 על המסלול. הכדור פוגע ברצפה במרחק D">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="150" y="8" width="140" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="150" y1="20" x2="290" y2="20" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="220" cy="20" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<line x1="220" y1="20" x2="117.2" y2="142.6" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="117.2" cy="142.6" r="7" fill="var(--d-label)" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="105.2" y="146.6" text-anchor="end">1</text>
<line x1="220" y1="20" x2="165.3" y2="170.4" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<circle cx="165.3" cy="170.4" r="7" fill="#ffffff" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="153.3" y="174.4" text-anchor="end">2</text>
<line x1="220" y1="20" x2="220" y2="180" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<circle cx="220" cy="180" r="7" fill="#ffffff" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="232" y="184" text-anchor="start">3</text>
<line x1="220" y1="20" x2="274.7" y2="170.4" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<circle cx="274.7" cy="170.4" r="7" fill="#ffffff" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="286.7" y="174.4" text-anchor="start">4</text>
<line x1="220" y1="20" x2="322.8" y2="142.6" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<circle cx="322.8" cy="142.6" r="7" fill="#ffffff" stroke="var(--d-line)" stroke-width="2"/>
<text class="label" x="334.8" y="146.6" text-anchor="start">5</text>
<line x1="80" y1="142.6" x2="220" y2="142.6" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="80" y1="180" x2="220" y2="180" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="90" y1="142.6" x2="90" y2="180" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="76" y="165.3" text-anchor="middle" transform="rotate(90.0 76 165.3)">h</text>
<text class="label" x="150" y="100" text-anchor="end">L</text>
<rect x="60" y="240" width="460" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="240" x2="520" y2="240" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="220" y1="222" x2="440" y2="222" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="330" y="240" text-anchor="middle">D</text>
<circle cx="440" cy="232" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
</svg>
