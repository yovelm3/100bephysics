<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" direction="ltr" role="img" aria-label="מסילה חלקה: מ-A בגובה 20 מטר יורד קטע ישר BC, קשת CDE ברדיוס 5 מטר עם D הנקודה הנמוכה, וקטע ישר EF עולה. לצד המסילה שמונה חצים ממוספרים לכיוונים">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="20" y="240" width="380" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="240" x2="400" y2="240" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 40,40 L 160,220 A 50 50 0 0 0 240,220 L 360,60" fill="none" stroke="var(--d-line)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="200" cy="190" r="50" fill="none" stroke="var(--d-dim)" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="200" y1="190" x2="230" y2="150" stroke="var(--d-dim)" stroke-width="1.2" stroke-linecap="round"/>
<text class="dim" x="222" y="180" text-anchor="middle">R</text>
<text class="label" x="28" y="40" text-anchor="middle">A</text>
<text class="label" x="86" y="130" text-anchor="middle">B</text>
<text class="label" x="148" y="234" text-anchor="middle">C</text>
<text class="label" x="200" y="256" text-anchor="middle">D</text>
<text class="label" x="252" y="234" text-anchor="middle">E</text>
<text class="label" x="314" y="140" text-anchor="middle">F</text>
<line x1="20" y1="40" x2="20" y2="240" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="6" y="144" text-anchor="middle" transform="rotate(90.0 6 144)">h = 20 m</text>
<line x1="480" y1="120" x2="480" y2="86" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="480" y="79" text-anchor="middle">1</text>
<line x1="480" y1="120" x2="504" y2="96" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="512.5" y="92.5" text-anchor="middle">2</text>
<line x1="480" y1="120" x2="514" y2="120" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="526" y="125" text-anchor="middle">3</text>
<line x1="480" y1="120" x2="504" y2="144" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="512.5" y="157.5" text-anchor="middle">4</text>
<line x1="480" y1="120" x2="480" y2="154" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="480" y="171" text-anchor="middle">5</text>
<line x1="480" y1="120" x2="456" y2="144" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="447.5" y="157.5" text-anchor="middle">6</text>
<line x1="480" y1="120" x2="446" y2="120" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="434" y="125" text-anchor="middle">7</text>
<line x1="480" y1="120" x2="456" y2="96" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="447.5" y="92.5" text-anchor="middle">8</text>
</svg>
