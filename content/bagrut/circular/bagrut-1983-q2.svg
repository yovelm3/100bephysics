<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" direction="ltr" role="img" aria-label="סחרחרה: עמוד אנכי, ומקצהו העליון זרוע אופקית באורך b = 1.4 מטר. בקצה הזרוע חבל באורך 2 מטר ובקצהו כיסא במסה 5 קילוגרם">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="40" y="250" width="480" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="40" y1="250" x2="520" y2="250" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="100" y="40" width="12" height="210" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="106" y1="46" x2="226" y2="46" stroke="var(--d-line)" stroke-width="3" stroke-linecap="round"/>
<line x1="106" y1="26" x2="226" y2="26" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="166" y="44" text-anchor="middle">b = 1.4 m</text>
<line x1="226" y1="46" x2="226" y2="170" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<text class="label" x="236" y="112" text-anchor="start">ℓ</text>
<polygon points="212,170 240,170 246,196 206,196" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="2" stroke-linejoin="round"/>
<text class="label" x="226" y="216" text-anchor="middle">m</text>
<line x1="226" y1="46" x2="325.2" y2="120.4" stroke="var(--d-dim)" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
</svg>
