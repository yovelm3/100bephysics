<line x1="240.5" y1="242.2" x2="212.5" y2="242.2" stroke="var(--d-label)" stroke-width="1.5" marker-end="url(#f-arr)"/>
<text class="dim" x="200.5" y="247.2" text-anchor="middle">VII</text>
<line x1="240.5" y1="242.2" x2="220.7" y2="222.4" stroke="var(--d-label)" stroke-width="1.5" marker-end="url(#f-arr)"/>
<text class="dim" x="212.2" y="218.9" text-anchor="middle">VIII</text>
