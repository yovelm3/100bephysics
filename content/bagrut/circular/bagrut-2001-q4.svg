<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="נדנדה ענקית: מגדל בגובה 46 מטר, ומתקן קשתי. הנערים קשורים בכבלים באורך 50 מטר לנקודה O, מורמים ל-A ומשוחררים, ונעים בקשת ABC. B הנקודה הנמוכה, 1 מטר מעל הקרקע. בנקודה M שבין A ל-B שמונה כיוונים I עד VIII">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="20" y="280" width="520" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="20" y1="280" x2="540" y2="280" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="300" cy="20" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="300" y="14" text-anchor="middle">O</text>
<path d="M 168.1,208.4 A 230 230 0 0 0 431.9,208.4" fill="none" stroke="var(--d-dim)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
<line x1="300" y1="20" x2="300" y2="250" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text class="dim" x="308" y="140" text-anchor="start">50 m</text>
<circle cx="168.1" cy="208.4" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="160.1" y="202.4" text-anchor="end">A</text>
