<text class="dim" x="240.5" y="207.2" text-anchor="middle">I</text>
<line x1="240.5" y1="242.2" x2="260.3" y2="222.4" stroke="var(--d-label)" stroke-width="1.5" marker-end="url(#f-arr)"/>
<text class="dim" x="268.8" y="218.9" text-anchor="middle">II</text>
<line x1="240.5" y1="242.2" x2="268.5" y2="242.2" stroke="var(--d-label)" stroke-width="1.5" marker-end="url(#f-arr)"/>
<text class="dim" x="280.5" y="247.2" text-anchor="middle">III</text>
