<polygon points="162.1,212.4 144.1,280 180.1,280" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="30" y1="208.4" x2="30" y2="280" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="16" y="248.2" text-anchor="middle" transform="rotate(90.0 16 248.2)">46 m</text>
<line x1="340" y1="250" x2="340" y2="280" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
