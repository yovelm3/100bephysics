<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" direction="ltr" role="img" aria-label="כדור במסה m בקצה חוט באורך L שקשור לנקודה O, משוחרר כשהחוט אופקי. מסמר C נמצא L/2 מתחת ל-O. אחרי שהחוט נתקל במסמר הכדור נע במעגל סביב C, והחוט יוצר זווית אלפא עם OC">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="180" cy="50" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="170" y="44" text-anchor="end">O</text>
<line x1="180" y1="50" x2="380" y2="50" stroke="var(--d-line)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<circle cx="380" cy="50" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="394" y="54" text-anchor="start">m</text>
<line x1="180" y1="30" x2="380" y2="30" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="280" y="48" text-anchor="middle">L</text>
<path d="M 380,50 A 200 200 0 0 1 180,250" fill="none" stroke="var(--d-dim)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M 180,250 A 100.0 100.0 0 0 1 110,80.0" fill="none" stroke="var(--d-dim)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 5"/>
<line x1="180" y1="50" x2="180" y2="150" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="180" cy="150" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="170" y="166" text-anchor="end">C</text>
<line x1="180" y1="150" x2="115.7" y2="73.4" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="115.7" cy="73.4" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<path d="M 180,124 A 26 26 0 0 0 163.3,130.1" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="166.3" y="117.4" text-anchor="middle">α</text>
<text class="label" x="192" y="104" text-anchor="start">L/2</text>
</svg>
