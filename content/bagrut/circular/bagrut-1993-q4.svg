<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="מסילה חסרת חיכוך: רבע מעגל AB ברדיוס R סביב O, ואחריו לולאה מעגלית BCDEF ברדיוס r סביב O'. EC הוא קוטר אופקי של הלולאה">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<path d="M 40,40 A 210 210 0 0 0 250,250" fill="none" stroke="var(--d-line)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="250" cy="40" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="260" y="44" text-anchor="start">O</text>
<circle cx="46" cy="34" r="6" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="34" y="28" text-anchor="end">A</text>
<circle cx="250" cy="194" r="56" fill="none" stroke="var(--d-line)" stroke-width="3"/>
<path d="M 250,250 A 210 210 0 0 0 460,40" fill="none" stroke="var(--d-line)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="250" cy="194" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="258" y="198" text-anchor="start">O'</text>
<circle cx="250" cy="250" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="250" y="270" text-anchor="middle">B</text>
<circle cx="306" cy="194" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="320" y="199" text-anchor="middle">C</text>
<circle cx="250" cy="138" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="250" y="130" text-anchor="middle">D</text>
<circle cx="194" cy="194" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="180" y="199" text-anchor="middle">E</text>
<circle cx="422" cy="160.5" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="434" y="164.5" text-anchor="start">F</text>
<line x1="20" y1="40" x2="20" y2="250" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="6" y="149" text-anchor="middle" transform="rotate(90.0 6 149)">R</text>
</svg>
