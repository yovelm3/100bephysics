<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" direction="ltr" role="img" aria-label="רוטור בפארק שעשועים: גליל ברדיוס 3 מטר שמסתובב סביב צירו האנכי OP. אדם עומד צמוד לדופן הפנימית. כשהגליל מסתובב מהר מספיק מורידים את הרצפה, והאדם נשאר צמוד לדופן">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<ellipse cx="280" cy="50" rx="150" ry="30" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<line x1="130" y1="50" x2="130" y2="210" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="430" y1="50" x2="430" y2="210" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<path d="M 130,210 A 150 30 0 0 0 430,210" fill="none" stroke="var(--d-line)" stroke-width="2"/>
<path d="M 130,210 A 150 30 0 0 1 430,210" fill="none" stroke="var(--d-dim)" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="280" y1="20" x2="280" y2="250" stroke="var(--d-dim)" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/>
<text class="label" x="290" y="24" text-anchor="start">P</text>
<text class="label" x="288" y="222" text-anchor="start">O</text>
<line x1="280" y1="210" x2="430" y2="210" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="355" y="228" text-anchor="middle">r</text>
<g stroke="var(--d-line)" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="400" cy="108.4" r="11.2"/><line x1="400" y1="119.6" x2="400" y2="147.6"/><line x1="400" y1="147.6" x2="387.4" y2="170"/><line x1="400" y1="147.6" x2="412.6" y2="170"/><line x1="383.2" y1="130.8" x2="416.8" y2="130.8"/></g>
<path d="M 255,10 A 25 7 0 1 0 305,10" fill="none" stroke="var(--d-body)" stroke-width="2" stroke-linejoin="round" marker-end="url(#f-arr)"/>
</svg>
