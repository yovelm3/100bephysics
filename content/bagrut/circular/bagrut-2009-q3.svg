<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="ציר אנכי שמסובב מנוע. בראשו חוט באורך L ובקצהו כדור m שנע במעגל אופקי. החוט נוטה בזווית אלפא מהאנך. וטבלה: תדירות ומידת הזווית בשש מדידות">
