<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="ציר אנכי, ומולחם אליו צינור בזווית של 75 מעלות לציר. גוף במסה m בתוך הצינור, במרחק r = 10 סנטימטר מהציר">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="120" y="20" width="16" height="230" rx="0" fill="var(--d-fill)" stroke="var(--d-line)" stroke-width="2"/>
<text class="heb" x="128" y="14" text-anchor="middle" direction="rtl">ציר</text>
<line x1="128" y1="192" x2="475.7" y2="98.8" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<line x1="128" y1="208" x2="475.7" y2="114.8" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<rect x="328.5" y="137.1" width="24" height="12" rx="2" fill="var(--d-body)" stroke="var(--d-line)" stroke-width="1.5" transform="rotate(-15 340.5 143.1)"/>
<text class="label" x="340.5" y="148.1" text-anchor="middle" style="fill:#ffffff">m</text>
<path d="M 160.8,191.2 A 34 34 0 0 0 128,166" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="157.2" y="166.9" text-anchor="middle">α</text>
<line x1="128" y1="236" x2="340.5" y2="236" stroke="var(--d-dim)" stroke-width="1.3" marker-start="url(#f-dim)" marker-end="url(#f-dim)"/>
<text class="dim" x="234.3" y="254" text-anchor="middle">r</text>
<line x1="340.5" y1="143.1" x2="340.5" y2="240" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
</svg>
