<text class="label" x="280" y="244" text-anchor="middle">A</text>
<circle cx="280" cy="30" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="280" y="20" text-anchor="middle">B</text>
