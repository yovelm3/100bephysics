<line x1="347.2" y1="57.8" x2="359.7" y2="73.3" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-arr)" stroke-linecap="round"/>
<line x1="347.2" y1="192.2" x2="331.7" y2="204.7" stroke="var(--d-line)" stroke-width="1.8" marker-end="url(#f-arr)" stroke-linecap="round"/>
<rect x="60" y="240" width="440" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="60" y1="240" x2="500" y2="240" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
