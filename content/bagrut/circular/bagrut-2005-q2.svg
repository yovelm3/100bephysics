<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" direction="ltr" role="img" aria-label="מטוטלת: משקולת 100 גרם על חוט באורך 1 מטר, מתנודדת בין A ל-C, בזווית מרבית של 60 מעלות מהאנך. B הנקודה הנמוכה. ולידה שמונה חצים ממוספרים">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<rect x="150" y="18" width="100" height="12" rx="0" fill="url(#f-hatch)" stroke="none" stroke-width="0"/>
<line x1="150" y1="30" x2="250" y2="30" stroke="var(--d-line)" stroke-width="2" stroke-linecap="round"/>
<circle cx="200" cy="30" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<path d="M 52.8,115.0 A 170 170 0 0 0 347.2,115.0" fill="none" stroke="var(--d-dim)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 5"/>
<line x1="200" y1="30" x2="347.2" y2="115" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="347.2" cy="115" r="8" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="359.2" y="119" text-anchor="start">C</text>
<text class="label" x="40.8" y="119" text-anchor="end">A</text>
<text class="label" x="200" y="220" text-anchor="middle">B</text>
<line x1="200" y1="30" x2="200" y2="200" stroke="var(--d-dim)" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<path d="M 200,60 A 30 30 0 0 0 226,45" fill="none" stroke="var(--d-line)" stroke-width="1.5" stroke-linejoin="round"/>
<text class="label" x="223" y="74.8" text-anchor="middle">60°</text>
<text class="dim" x="287.6" y="72.5" text-anchor="start">1 m</text>
<line x1="460" y1="130" x2="460" y2="80" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="460" y="71" text-anchor="middle">1</text>
<line x1="460" y1="130" x2="485" y2="86.7" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="492" y="79.6" text-anchor="middle">2</text>
<line x1="460" y1="130" x2="510" y2="130" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="524" y="135" text-anchor="middle">3</text>
<line x1="460" y1="130" x2="485" y2="173.3" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="492" y="190.4" text-anchor="middle">4</text>
<line x1="460" y1="130" x2="460" y2="180" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="460" y="199" text-anchor="middle">5</text>
<line x1="460" y1="130" x2="435" y2="173.3" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="428" y="190.4" text-anchor="middle">6</text>
<line x1="460" y1="130" x2="410" y2="130" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="396" y="135" text-anchor="middle">7</text>
<line x1="460" y1="130" x2="435" y2="86.7" stroke="var(--d-label)" stroke-width="1.8" marker-end="url(#f-arr)"/>
<text class="label" x="428" y="79.6" text-anchor="middle">8</text>
<text class="dim" x="490" y="118" text-anchor="start">60°</text>
<text class="dim" x="430" y="118" text-anchor="end">60°</text>
</svg>
