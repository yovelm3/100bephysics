<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" direction="ltr" role="img" aria-label="תרשים א: כדור A במסה 0.1 קילוגרם מוחזק בקצה חוט אופקי באורך 80 סנטימטר, וכדור B במסה 0.3 קילוגרם תלוי במנוחה על חוט אנכי באותו אורך. תרשים ב: כדור A משוחרר ונע במסלול מעגלי, ובנקודה S החוט ניתק">
<defs>
<pattern id="f-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--d-hatch)" stroke-width="2"/></pattern>
<marker id="f-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-dim)" stroke-width="1.5"/></marker>
<marker id="f-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-label)"/></marker>
<marker id="f-ask" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-ask)"/></marker>
<marker id="f-force" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,6 L0,11.5 L3,6 z" fill="var(--d-force, var(--d-label))"/></marker>
<marker id="f-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--d-line)" stroke-width="1.5"/></marker>
</defs>
<circle cx="430" cy="50" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="436" y="40" text-anchor="start">O₁ O₂</text>
<line x1="310" y1="50" x2="430" y2="50" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="310" cy="50" r="9" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="294" y="54" text-anchor="end">A</text>
<line x1="430" y1="50" x2="430" y2="170" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="430" cy="178" r="11" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="430" y="208" text-anchor="middle">B</text>
<text class="heb" x="370" y="240" text-anchor="middle" direction="rtl">תרשים א</text>
<circle cx="200" cy="50" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="206" y="40" text-anchor="start">O₁</text>
<line x1="80" y1="50" x2="200" y2="50" stroke="var(--d-line)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="80" cy="50" r="9" fill="var(--d-body)" stroke="none" stroke-width="2"/>
<text class="label" x="64" y="54" text-anchor="end">A</text>
<path d="M 80,50 A 120 120 0 0 0 285,135" fill="none" stroke="var(--d-dim)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/>
<circle cx="270" cy="147" r="3.5" fill="var(--d-label)" stroke="none" stroke-width="2"/>
<text class="label" x="260" y="170" text-anchor="middle">S</text>
<text class="heb" x="160" y="240" text-anchor="middle" direction="rtl">תרשים ב</text>
</svg>
